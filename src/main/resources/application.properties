spring.application.name=RUBY
server.port=8080

# RUBY asks each user for their name. Optionally credit the developer
# in answers to "who created you" (leave empty for a generic answer).
ruby.creator-name=

# Never leak stack traces or exception details to the browser
spring.web.error.include-stacktrace=never
spring.web.error.include-message=never

# Notes and history live in the browser session; expire after 8 hours idle
server.servlet.session.timeout=8h
